<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — The Alisha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/The-Alisha/public/components/navbar/navbar.css" />
  <link rel="stylesheet" href="/The-Alisha/public/components/cart/cart.css" />
  <style>
    :root {
      --primary: #f85ca8;
      --primary-dark: #c83b77;
      --surface: #ffffff;
      --text: #2d2436;
      --muted: #6c6379;
      --border: rgba(200, 59, 119, 0.16);
      --radius: 20px;
      --shadow: 0 18px 45px rgba(200, 59, 119, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #fffafc 0%, #ffeaf4 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .orders-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    .page-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
    }
    .order-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 1.8rem;
      margin-bottom: 1.5rem;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(200, 59, 119, 0.12);
      margin-bottom: 1.2rem;
    }
    .order-num {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-dark);
    }
    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .status-badge.pending { background: #fef3c7; color: #d97706; }
    .status-badge.processing { background: #e0f2fe; color: #0284c7; }
    .status-badge.shipped { background: #f3e8ff; color: #9333ea; }
    .status-badge.delivered, .status-badge.paid { background: #d1fae5; color: #059669; }
    .status-badge.cancelled { background: #fee2e2; color: #dc2626; }
    .order-items-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .order-item-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .order-item-thumb {
      width: 50px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background: #fdf2f8;
      border: 1px solid var(--border);
    }
    .order-item-info {
      flex: 1;
    }
    .order-item-name {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .order-item-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px dashed rgba(200, 59, 119, 0.15);
      font-size: 0.9rem;
    }
    .empty-view {
      text-align: center;
      padding: 4rem 1.5rem;
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div id="navbar-root"></div>

  <main class="orders-container">
    <header class="page-header">
      <h1 class="page-title">My Orders</h1>
      <p class="page-subtitle">Track your shipments and view past order invoices</p>
    </header>

    <div id="ordersListContainer">
      <div style="text-align:center; padding: 3rem;">Loading your orders...</div>
    </div>
  </main>

  <script src="/The-Alisha/public/components/navbar/navbar-loader.js"></script>
  <script src="/The-Alisha/public/components/cart/cart-manager.js"></script>
  <script>
    async function loadOrders() {
      const container = document.getElementById('ordersListContainer');
      try {
        const res = await fetch('/The-Alisha/server-side/backend/orders.php', { credentials: 'include' });
        const data = await res.json();

        if (!data.success || !data.orders || data.orders.length === 0) {
          container.innerHTML = `
            <div class="empty-view">
              <div style="font-size:3.5rem; margin-bottom:1rem;">📦</div>
              <h2 style="color:var(--primary-dark); margin-bottom:0.5rem;">No orders placed yet</h2>
              <p style="color:var(--muted); margin-bottom:1.5rem;">When you order clothes and beauty items, your receipts and tracking will appear here.</p>
              <a href="/The-Alisha/Client-side/Home/newArrival/new-Arrivals.html" class="cat-pill active" style="display:inline-block; padding:0.75rem 1.8rem; background:linear-gradient(90deg, var(--primary), var(--primary-dark)); color:#fff; border-radius:999px; text-decoration:none; font-weight:700;">Start Shopping</a>
            </div>
          `;
          return;
        }

        container.innerHTML = data.orders.map(order => {
          const statusClass = (order.status || 'Pending').toLowerCase();
          const items = order.items || [];
          const dateStr = order.createdAt ? new Date(order.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'Recent';

          return `
            <article class="order-card">
              <div class="order-header">
                <div>
                  <span class="order-num">Order #${order.orderNumber}</span>
                  <div style="font-size:0.82rem; color:var(--muted); margin-top:0.2rem;">Placed on ${dateStr} • ${order.paymentMethod}</div>
                </div>
                <span class="status-badge ${statusClass}">${order.status}</span>
              </div>

              <div class="order-items-list">
                ${items.map(item => `
                  <div class="order-item-row">
                    <img src="${item.image || 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=400&q=80'}" class="order-item-thumb" onerror="this.src='https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=400&q=80'">
                    <div class="order-item-info">
                      <div class="order-item-name">${item.name}</div>
                      <div class="order-item-meta">Qty: ${item.quantity} • Size: ${item.size || 'M'}</div>
                    </div>
                    <div style="font-weight:700; color:var(--primary-dark);">${AlishaCart.formatPrice(item.lineTotal || (item.price * item.quantity))}</div>
                  </div>
                `).join('')}
              </div>

              <div class="order-footer">
                <div>
                  <span style="color:var(--muted);">Delivery Address: </span>
                  <strong>${order.shippingAddress}, ${order.city}</strong>
                </div>
                <div>
                  <span style="color:var(--muted);">Total Amount: </span>
                  <strong style="font-size:1.15rem; color:var(--primary-dark);">${order.formattedTotal}</strong>
                </div>
              </div>
            </article>
          `;
        }).join('');
      } catch (e) {
        container.innerHTML = `<div class="empty-view"><p>Unable to load orders. Please make sure you are signed in.</p></div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
