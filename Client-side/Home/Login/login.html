<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE-ALISHA || Login</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  
  <div class="login-shell">
    
    <section class="login-card">
      <div class="card-heading">
        
        <div class="logo">
      <img src="../../../public/logo/image.png" alt="The Alisha logo" class="logo-image">
     <h2>Login To Your Account</h2>
    </div> 
      </div>

      <form class="auth-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@gmail.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" />
        </div>

        <div class="form-row">
          <label class="remember-me"><input type="checkbox" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit">Log In</button>
      </form>

      <div class="divider"><span>or</span></div>

      <p class="secondary-link">New here? <a href="../Register/register.html">Create an account</a></p>
    </section>
  </div>
  <script src="../Login/login.js"> </script> 
  <script src="/The-Alisha/public/components/navbar/navbar-loader.js"></script>
</body>
</html>
