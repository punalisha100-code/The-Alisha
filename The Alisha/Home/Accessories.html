<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Accessories | E-Commerce</title>
  <style>
    :root {
      --primary-color: #f85ca8;
      --accent-color: #c83b77;
      --bg-color: #fffafc;
      --card-bg: #ffffff;
      --text-main: #2d2436;
      --text-muted: #6c6379;
      --border-color: rgba(200, 59, 119, 0.16);
      --radius: 22px;
      --shadow: 0 20px 45px rgba(200, 59, 119, 0.12);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fffafc 0%, #ffeaf4 100%);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .navbar .logo {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-color);
    }

    .navbar ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin: 0;
      padding: 0;
    }

    .navbar a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 600;
      padding: 0.65rem 0.9rem;
      border-radius: 999px;
      transition: var(--transition);
    }

    .navbar a:hover {
      color: #fff;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
    }

    header {
      text-align: left;
      margin: 2rem 0 1.5rem;
    }

    header h1 {
      font-size: clamp(2rem, 4vw, 2.7rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: var(--accent-color);
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 720px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 36px rgba(200, 59, 119, 0.16);
    }

    .image-container {
      position: relative;
      width: 100%;
      height: 280px;
      overflow: hidden;
      background: #fef4f9;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }

    .product-card:hover .image-container img {
      transform: scale(1.05);
    }

    .badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
      color: #ffffff;
      padding: 0.35rem 0.75rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    .product-details {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
      gap: 0.75rem;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .product-price {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary-color);
      white-space: nowrap;
    }

    .product-description {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    .comments-section {
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      margin-top: auto;
    }

    .comments-section h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    .comments-list {
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-right: 0.2rem;
    }

    .comments-list::-webkit-scrollbar {
      width: 4px;
    }

    .comments-list::-webkit-scrollbar-thumb {
      background: #e6c8d7;
      border-radius: 4px;
    }

    .comment-item {
      background: #fff8fb;
      padding: 0.7rem 0.8rem;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .comment-author {
      font-weight: 700;
      color: var(--accent-color);
      display: block;
      margin-bottom: 0.12rem;
    }

    .comment-form {
      display: flex;
      gap: 0.5rem;
    }

    .comment-input {
      flex: 1;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
      background: #fff;
    }

    .comment-input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(248, 92, 168, 0.16);
    }

    .btn-submit {
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
      color: #ffffff;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-submit:hover {
      filter: brightness(1.04);
    }

    @media (max-width: 760px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.7rem;
      }
    }

    @media (max-width: 560px) {
      .container {
        padding: 0 0.85rem 2.5rem;
      }

      header {
        margin-top: 1.25rem;
      }

      .comment-form {
        flex-direction: column;
      }

      .btn-submit {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">The Alisha</div>
    <ul>
      <li><a href="../The.alisha/index.html">Home</a></li>
      <li><a href="new-Arrivals.html">New Arrivals</a></li>
      <li><a href="Fashion.html">Fashion</a></li>
      <li><a href="Beauty.html">Beauty</a></li>
      <li><a href="Accessories.html">Accessories</a></li>
      <li><a href="../Login/login.html"></a></li>
    </ul>
  </nav>
  <div class="container">
    <header>
      <h1>New Accessories Collection</h1>
      <p>Elevate your everyday wardrobe with our latest handcrafted additions.</p>
    </header>

    <main class="product-grid" id="productGrid">
      <!-- Cards rendered dynamically via JS -->
    </main>
  </div>

  <script>
    /* ==========================================================================
       5. DATA SOURCE & DYNAMIC RENDERING
       ========================================================================== */
    const accessoriesData = [
      {
        id: "acc-1",
        title: "Minimalist Leather Belt",
        price: "$48.00",
        badge: "New Arrival",
        image: "https://images.unsplash.com/photo-1624222247344-550fb60583dc?auto=format&fit=crop&w=600&q=80",
        description: "Full-grain Italian leather belt finished with a brushed solid brass buckle.",
        comments: [
          { author: "Elena R.", text: "The quality of the leather is top notch!" },
          { author: "Mark T.", text: "Sizing was spot on. Highly recommended." }
        ]
      },
      {
        id: "acc-2",
        title: "UV400 Polarized Sunglasses",
        price: "$85.00",
        badge: "Trending",
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80",
        description: "Classic acetate frame offering maximum solar protection and lightweight comfort.",
        comments: [
          { author: "Sophia M.", text: "Super trendy and comfortable on the nose bridge." }
        ]
      },
      {
        id: "acc-3",
        title: "Silk Patterned Scarf",
        price: "$62.00",
        badge: "Limited Edition",
        image: "https://images.unsplash.com/photo-1601924994987-69e26d50dc26?auto=format&fit=crop&w=600&q=80",
        description: "100% mulberry silk scarf featuring hand-rolled edges and bespoke prints.",
        comments: [
          { author: "Clara W.", text: "Colors are even more vibrant in person!" }
        ]
      }
    ];

    // Render Products to DOM
    function renderProducts() {
      const grid = document.getElementById("productGrid");
      
      grid.innerHTML = accessoriesData.map(product => `
        <article class="product-card" data-id="${product.id}">
          <div class="image-container">
            <span class="badge">${product.badge}</span>
            <img src="${product.image}" alt="${product.title}" loading="lazy">
          </div>
          
          <div class="product-details">
            <div class="product-header">
              <h3 class="product-title">${product.title}</h3>
              <span class="product-price">${product.price}</span>
            </div>
            
            <p class="product-description">${product.description}</p>

            <div class="comments-section">
              <h4>Customer Feedback</h4>
              <div class="comments-list" id="comments-${product.id}">
                ${product.comments.map(c => `
                  <div class="comment-item">
                    <span class="comment-author">${escapeHTML(c.author)}</span>
                    ${escapeHTML(c.text)}
                  </div>
                `).join('')}
              </div>

              <form class="comment-form" onsubmit="handleCommentSubmit(event, '${product.id}')">
                <input 
                  type="text" 
                  class="comment-input" 
                  placeholder="Write a comment..." 
                  required 
                />
                <button type="submit" class="btn-submit">Post</button>
              </form>
            </div>
          </div>
        </article>
      `).join('');
    }

    /* ==========================================================================
       6. INTERACTION LOGIC & HELPER FUNCTIONS
       ========================================================================== */
    function handleCommentSubmit(event, productId) {
      event.preventDefault();
      const form = event.target;
      const input = form.querySelector('.comment-input');
      const commentText = input.value.trim();

      if (!commentText) return;

      // Locate destination comments container
      const commentsContainer = document.getElementById(`comments-${productId}`);

      // Create new element
      const commentElement = document.createElement('div');
      commentElement.className = 'comment-item';
      commentElement.innerHTML = `
        <span class="comment-author">You</span>
        ${escapeHTML(commentText)}
      `;

      // Append and smooth scroll to bottom of comment list
      commentsContainer.appendChild(commentElement);
      commentsContainer.scrollTop = commentsContainer.scrollHeight;

      // Reset form input
      input.value = '';
    }

    // Security helper to prevent XSS in comment inputs
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Initialize application on DOM load
    document.addEventListener("DOMContentLoaded", renderProducts);
  </script>
</body>
</html>
