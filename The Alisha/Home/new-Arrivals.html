<body>

  <div class="container">
    <header class="header">
      <h1>New Arrivals</h1>
      <p>Discover our latest seasonal collection designed for comfort and modern style.</p>
    </header>

    <main class="product-grid" id="productGrid">
      <!-- Injected via JavaScript -->
    </main>
  </div>

  <script>
    /* ==========================================================================
       5. Modern ES6 JavaScript Architecture
       ========================================================================== */
    const productsData = [
      {
        id: "p1",
        title: "long onepice",
        price: "2500",
        badge: "New",
        rating: 4.8,
        image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQePizqT3-jra4cnzS0WnnJZzbfecXn_5Z5mW0Y0wDB5g&s=10=80",
        comments: [
          { author: "Alex M.", text: "The fit is loose and extremely comfortable!" },
          { author: "Sarah K.", text: "Perfect fabric quality for hot summer days." }
        ]
      },
      {
        id: "p2",
        title: "long onepice",
        price: "RS2400",
        badge: "New",
        rating: 4.9,
        image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQzJal3ISYePvUWMuXNhZ5-HVd1MI9WdFPBnB9HMnXCh91PRdJ2Q9ghQ0&s=10=80",
        comments: [
          { author: "Elena R.", text: "Looks far more expensive than it is. Highly recommend!" }
        ]
      },
      {
        id: "p3",
        title: "long onepice",
        price: "Rs1700",
        badge: "New",
        rating: 4.7,
        image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvm-1mpeBBTR2jZ2TItXQRhYkPcqg49jRtvV8w29H1IvOQviRPEcj6UjE&s=10=80",
        comments: [
          { author: "Marcus B.", text: "Heavyweight denim that holds structure nicely." }
        ]
      },
      {
        id: "p3",
        title: "long onepice",
        price: "Rs1700",
        badge: "New",
        rating: 4.7,
        image: "https://assets.myntassets.com/assets/images/2026/JUNE/29/gZ5nVj1X_33f40317bd864bca88a3e97dd520f8f5.jpg=10=80",
        comments: [
          { author: "Marcus B.", text: "Heavyweight denim that holds structure nicely." }
        ]
      },
      {
        id: "p4",
        title: "onepice",
        price: "RS2000",
        badge: "New",
        rating: 4.6,
        image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQf5ZFcKB3NWWhxIzpX8g-7C7XF9BCIXM7ZlBwcnYKCVA&s=10=80",
        comments: [
          { author: "Chloe T.", text: "Super crisp pleats. Great for smart casual workwear." }
        ]
      }
    ];

    class ProductCatalog {
      constructor(containerId, products) {
        this.container = document.getElementById(containerId);
        this.products = products;
      }

      init() {
        this.render();
        this.attachEventListeners();
      }

      render() {
        this.container.innerHTML = this.products.map(product => this.createCardHTML(product)).join('');
      }

      createCardHTML(product) {
        const commentsCount = product.comments.length;
        const commentsList = product.comments.map(c => `
          <div class="comment-item">
            <div class="comment-author">${this.escapeHTML(c.author)}</div>
            <div class="comment-text">${this.escapeHTML(c.text)}</div>
          </div>
        `).join('');

        return `
        
          <article class="product-card" data-id="${product.id}">
            <div class="media-wrapper">
              <span class="badge">${product.badge}</span>
              <img src="${product.image}" alt="${this.escapeHTML(product.title)}" loading="lazy">
            </div>

            <div class="card-body">
              <div class="product-meta">
                <h2 class="product-title">${this.escapeHTML(product.title)}</h2>
                <span class="product-price">${product.price}</span>
              </div>

              <div class="rating">
                <span class="star">★</span>
                <span><strong>${product.rating}</strong> (${commentsCount} feedback)</span>
              </div>

              <button class="btn btn-primary">Add to Bag</button>
              
              <button class="btn btn-outline js-toggle-comments" aria-expanded="false">
                💬 Comments (<span class="js-comment-count">${commentsCount}</span>)
              </button>
            </div>

            <!-- Comments Drawer Section -->
            <div class="comments-drawer js-drawer">
              <div class="comments-content">
                <div class="comments-header">Customer Thoughts</div>
                <div class="comments-list js-comments-list">
                  ${commentsList}
                </div>
                
                <form class="comment-form js-comment-form">
                  <input type="text" class="comment-input" placeholder="Add a comment..." required>
                  <button type="submit" class="btn btn-primary btn-sm">Post</button>
                </form>
              </div>
            </div>
          </article>
        `;
      }

      attachEventListeners() {
        // Event Delegation pattern for better performance
        this.container.addEventListener('click', (e) => {
          const toggleBtn = e.target.closest('.js-toggle-comments');
          if (toggleBtn) {
            this.handleToggleComments(toggleBtn);
          }
        });

        this.container.addEventListener('submit', (e) => {
          if (e.target.matches('.js-comment-form')) {
            e.preventDefault();
            this.handleAddComment(e.target);
          }
        });
      }

      handleToggleComments(button) {
        const card = button.closest('.product-card');
        const drawer = card.querySelector('.js-drawer');
        const isOpen = drawer.classList.contains('open');

        drawer.classList.toggle('open');
        button.setAttribute('aria-expanded', !isOpen);
      }

      handleAddComment(form) {
        const card = form.closest('.product-card');
        const input = form.querySelector('.comment-input');
        const text = input.value.trim();

        if (!text) return;

        const commentsList = card.querySelector('.js-comments-list');
        const countSpan = card.querySelector('.js-comment-count');

        // Append new comment
        const commentEl = document.createElement('div');
        commentEl.className = 'comment-item';
        commentEl.innerHTML = `
          <div class="comment-author">You</div>
          <div class="comment-text">${this.escapeHTML(text)}</div>
        `;

        commentsList.appendChild(commentEl);
        commentsList.scrollTop = commentsList.scrollHeight; // Auto-scroll to bottom

        // Update counter
        const currentCount = parseInt(countSpan.textContent, 10);
        countSpan.textContent = currentCount + 1;

        input.value = '';
      }

      escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      }
    }

    // Initialize on DOM load
    document.addEventListener('DOMContentLoaded', () => {
      const catalog = new ProductCatalog('productGrid', productsData);
      catalog.init();
    });
  </script>
</body>
