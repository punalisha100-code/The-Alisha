<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | The Alisha</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-shell">
    <section class="login-card">
      <div class="card-heading">
        <span class="eyebrow">Secure sign in</span>
        <h2>Login</h2>
      </div>
      <p class="card-copy">Enter your details to access your account.</p>

      <form class="auth-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@gmail.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" />
        </div>

        <div class="form-row">
          <label class="remember-me"><input type="checkbox" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit">Log In</button>
      </form>

      <div class="divider"><span>or</span></div>
      <button type="button" class="social-btn">Continue with Google</button>
      <button type="button" class="social-btn alt">Continue with Apple</button>

      <p class="secondary-link">New here? <a href="../Register/register.html">Create an account</a></p>
    </section>
  </div>
  <script src="login.js"></script>
</body>
</html>
